aid: rx-redefined
name: Rx Redefined
description: >-
  Rx Redefined Inc is a healthcare technology company in Arroyo Grande, California, founded in 2018,
  that operates a patented, compliance-focused DMEPOS (durable medical equipment, prosthetics,
  orthotics and supplies) platform for physicians. The platform lets a medical practice become a
  licensed physician-owned DMEPOS supplier and distribute medical supplies — insulin pumps, breast
  pumps, ostomy pouches, urinary catheters — directly to its own patients instead of handing the
  order to a third-party supplier. It ships two products: a Full-Service product built around
  physician personal performance, and an In-Office product built around the in-office ancillary
  services exception. The platform covers CMS licensing onboarding, electronic ordering with
  per-order compliance and eligibility checks, supply-chain integration with 10+ U.S. distribution
  centers, and end-to-end revenue-cycle and audit management. The company reports use across 350+
  U.S. clinics and runs on ISO 27001 certified infrastructure with HIPAA controls. The product is a
  customer-only web application at app.rxredefined.com; Rx Redefined publishes no public API,
  developer portal, SDK or machine-readable contract of any kind.
